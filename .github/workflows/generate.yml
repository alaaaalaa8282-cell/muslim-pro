name: Generate Project

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Android Project
        run: |
          # Create directory structure
          mkdir -p app/src/main/java/com/muslimguide/muslimpro/{activities,fragments,adapters,models,helpers,receivers,services}
          mkdir -p app/src/main/res/{layout,drawable,values,menu,xml,font,raw}
          mkdir -p app/src/main/assets
          mkdir -p gradle/wrapper

          # gradle-wrapper.properties
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          EOF

          # settings.gradle
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "MuslimPro"
          include ':app'
          EOF

          # root build.gradle
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
              id 'com.google.gms.google-services' version '4.4.0' apply false
          }
          EOF

          # gradle.properties
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # app/build.gradle
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.muslimguide.muslimpro'
              compileSdkVersion 34
              defaultConfig {
                  applicationId 'com.muslimguide.muslimpro'
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0"
                  multiDexEnabled true
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.multidex:multidex:2.0.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.google.android.gms:play-services-location:21.0.1'
              implementation 'com.google.android.gms:play-services-maps:18.2.0'
              implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
              implementation 'com.android.volley:volley:1.2.1'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'com.squareup.picasso:picasso:2.8'
              implementation 'com.github.batoulapps:adhan-java:1.2.1'
          }
          EOF

          # proguard-rules.pro
          touch app/proguard-rules.pro

          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <application
                  android:name=".activities.App"
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity android:name=".activities.SplashActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".activities.MainActivity" android:exported="false"/>
                  <activity android:name=".activities.QuranActivity" android:exported="false"/>
                  <activity android:name=".activities.FullSuraActivity" android:exported="false"/>
                  <receiver android:name=".receivers.AdhanReceiver" android:exported="false"/>
                  <receiver android:name=".receivers.BootReceiver" android:exported="false">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      </intent-filter>
                  </receiver>
                  <service android:name=".services.AdhanService" android:exported="false"/>
              </application>
          </manifest>
          EOF

          # strings.xml
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">Muslim Pro</string>
          </resources>
          EOF

          # colors.xml
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources>
              <color name="colorPrimary">#1B5E20</color>
              <color name="colorPrimaryDark">#003300</color>
              <color name="colorAccent">#FFD700</color>
              <color name="white">#FFFFFF</color>
              <color name="black">#000000</color>
              <color name="tabColor">#1B5E20</color>
              <color name="backgroundColor">#F5F5F5</color>
          </resources>
          EOF

          # themes.xml
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
          </resources>
          EOF

          # App.java
          cat > app/src/main/java/com/muslimguide/muslimpro/activities/App.java << 'EOF'
          package com.muslimguide.muslimpro.activities;
          import android.app.Application;
          import com.android.volley.RequestQueue;
          import com.android.volley.toolbox.Volley;
          public class App extends Application {
              private static App instance;
              private RequestQueue requestQueue;
              @Override
              public void onCreate() {
                  super.onCreate();
                  instance = this;
                  requestQueue = Volley.newRequestQueue(this);
              }
              public static App getInstance() { return instance; }
              public RequestQueue getRequestQueue() { return requestQueue; }
          }
          EOF

          # SplashActivity.java
          cat > app/src/main/java/com/muslimguide/muslimpro/activities/SplashActivity.java << 'EOF'
          package com.muslimguide.muslimpro.activities;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import androidx.appcompat.app.AppCompatActivity;
          import com.muslimguide.muslimpro.R;
          public class SplashActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_splash);
                  new Handler().postDelayed(() -> {
                      startActivity(new Intent(this, MainActivity.class));
                      finish();
                  }, 2000);
              }
          }
          EOF

          # MainActivity.java
          cat > app/src/main/java/com/muslimguide/muslimpro/activities/MainActivity.java << 'EOF'
          package com.muslimguide.muslimpro.activities;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.fragment.app.Fragment;
          import com.google.android.material.bottomnavigation.BottomNavigationView;
          import com.muslimguide.muslimpro.R;
          import com.muslimguide.muslimpro.fragments.*;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  BottomNavigationView nav = findViewById(R.id.bottom_navigation);
                  loadFragment(new HomeFragment());
                  nav.setOnItemSelectedListener(item -> {
                      Fragment fragment;
                      int id = item.getItemId();
                      if (id == R.id.nav_home) fragment = new HomeFragment();
                      else if (id == R.id.nav_quran) fragment = new QuranFragment();
                      else if (id == R.id.nav_prayer) fragment = new PrayerTimeFragment();
                      else if (id == R.id.nav_qibla) fragment = new QiblaFragment();
                      else fragment = new MoreFragment();
                      return loadFragment(fragment);
                  });
              }
              private boolean loadFragment(Fragment fragment) {
                  getSupportFragmentManager().beginTransaction()
                      .replace(R.id.fragment_container, fragment).commit();
                  return true;
              }
          }
          EOF

          # HomeFragment.java
          cat > app/src/main/java/com/muslimguide/muslimpro/fragments/HomeFragment.java << 'EOF'
