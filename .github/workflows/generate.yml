          # NinetyNineNamesFragment.java
          cat > app/src/main/java/com/muslimguide/muslimpro/fragments/NinetyNineNamesFragment.java << 'EOF'
          package com.muslimguide.muslimpro.fragments;
          import android.os.Bundle;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.ViewGroup;
          import androidx.fragment.app.Fragment;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import com.android.volley.Request;
          import com.android.volley.toolbox.JsonArrayRequest;
          import com.muslimguide.muslimpro.R;
          import com.muslimguide.muslimpro.activities.App;
          import com.muslimguide.muslimpro.adapters.NamesAdapter;
          import com.muslimguide.muslimpro.models.IslamicName;
          import org.json.JSONException;
          import org.json.JSONObject;
          import java.util.ArrayList;
          import java.util.List;
          public class NinetyNineNamesFragment extends Fragment {
              @Override
              public View onCreateView(LayoutInflater inflater, ViewGroup container, Bundle savedInstanceState) {
                  View view = inflater.inflate(R.layout.fragment_ninetynine, container, false);
                  RecyclerView rv = view.findViewById(R.id.rvNames);
                  rv.setLayoutManager(new LinearLayoutManager(getContext()));
                  List<IslamicName> list = new ArrayList<>();
                  JsonArrayRequest req = new JsonArrayRequest(Request.Method.GET, "https://api.aladhan.com/v1/asmaAlHusna", null, response -> {
                      try {
                          for (int i = 0; i < response.length(); i++) {
                              JSONObject o = response.getJSONObject(i);
                              list.add(new IslamicName(o.getString("name"), o.getString("transliteration"), o.getString("number"), o.getJSONObject("en").getString("meaning")));
                          }
                          rv.setAdapter(new NamesAdapter(list));
                      } catch (JSONException e) { e.printStackTrace(); }
                  }, error -> {});
                  App.getInstance().getRequestQueue().add(req);
                  return view;
              }
          }
