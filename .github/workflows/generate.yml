          # AdhanService.java
          cat > app/src/main/java/com/muslimguide/muslimpro/services/AdhanService.java << 'EOF'
          package com.muslimguide.muslimpro.services;
          import android.app.Service;
          import android.content.Intent;
          import android.media.MediaPlayer;
          import android.os.IBinder;
          import com.muslimguide.muslimpro.R;
          public class AdhanService extends Service {
              private MediaPlayer mediaPlayer;
              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  mediaPlayer = MediaPlayer.create(this, R.raw.adhan);
                  if (mediaPlayer != null) {
                      mediaPlayer.start();
                      mediaPlayer.setOnCompletionListener(mp -> stopSelf());
                  }
                  return START_NOT_STICKY;
              }
              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (mediaPlayer != null) { mediaPlayer.release(); mediaPlayer = null; }
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

