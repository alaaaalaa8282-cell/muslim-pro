          # SuraAdapter.java
          cat > app/src/main/java/com/muslimguide/muslimpro/adapters/SuraAdapter.java << 'EOF'
          package com.muslimguide.muslimpro.adapters;
          import android.content.Context;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.TextView;
          import androidx.annotation.NonNull;
          import androidx.recyclerview.widget.RecyclerView;
          import com.muslimguide.muslimpro.R;
          import com.muslimguide.muslimpro.models.Sura;
          import java.util.List;
          public class SuraAdapter extends RecyclerView.Adapter<SuraAdapter.ViewHolder> {
              private List<Sura> list;
              private Context context;
              public SuraAdapter(List<Sura> list, Context context) { this.list = list; this.context = context; }
              @NonNull @Override
              public ViewHolder onCreateViewHolder(@NonNull ViewGroup parent, int viewType) {
                  View v = LayoutInflater.from(parent.getContext()).inflate(R.layout.item_sura, parent, false);
                  return new ViewHolder(v);
              }
              @Override
              public void onBindViewHolder(@NonNull ViewHolder holder, int position) {
                  Sura s = list.get(position);
                  holder.tvNumber.setText(String.valueOf(s.getNumber()));
                  holder.tvName.setText(s.getEnglishName());
                  holder.tvArabic.setText(s.getArabicName());
                  holder.tvAyahs.setText(s.getAyahCount() + " آيات");
              }
              @Override public int getItemCount() { return list.size(); }
              public class ViewHolder extends RecyclerView.ViewHolder {
                  TextView tvNumber, tvName, tvArabic, tvAyahs;
                  public ViewHolder(@NonNull View itemView) {
                      super(itemView);
                      tvNumber = itemView.findViewById(R.id.tvNumber);
                      tvName = itemView.findViewById(R.id.tvName);
                      tvArabic = itemView.findViewById(R.id.tvArabic);
                      tvAyahs = itemView.findViewById(R.id.tvAyahs);
                  }
              }
          }
          EOF

          # NamesAdapter.java
          cat > app/src/main/java/com/muslimguide/muslimpro/adapters/NamesAdapter.java << 'EOF'
          package com.muslimguide.muslimpro.adapters;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.TextView;
          import androidx.annotation.NonNull;
          import androidx.recyclerview.widget.RecyclerView;
          import com.muslimguide.muslimpro.R;
          import com.muslimguide.muslimpro.models.IslamicName;
          import java.util.List;
          public class NamesAdapter extends RecyclerView.Adapter<NamesAdapter.ViewHolder> {
              private List<IslamicName> list;
              public NamesAdapter(List<IslamicName> list) { this.list = list; }
              @NonNull @Override
              public ViewHolder onCreateViewHolder(@NonNull ViewGroup parent, int viewType) {
                  View v = LayoutInflater.from(parent.getContext()).inflate(R.layout.item_name, parent, false);
                  return new ViewHolder(v);
              }
              @Override
              public void onBindViewHolder(@NonNull ViewHolder holder, int position) {
                  IslamicName n = list.get(position);
                  holder.tvNumber.setText(n.getNumber());
                  holder.tvArabic.setText(n.getName());
                  holder.tvEnglish.setText(n.getTransliteration());
                  holder.tvMeaning.setText(n.getMeaning());
              }
              @Override public int getItemCount() { return list.size(); }
              public class ViewHolder extends RecyclerView.ViewHolder {
                  TextView tvNumber, tvArabic, tvEnglish, tvMeaning;
                  public ViewHolder(@NonNull View itemView) {
                      super(itemView);
                      tvNumber = itemView.findViewById(R.id.tvNumber);
                      tvArabic = itemView.findViewById(R.id.tvArabic);
                      tvEnglish = itemView.findViewById(R.id.tvEnglish);
                      tvMeaning = itemView.findViewById(R.id.tvMeaning);
                  }
              }
          }
          EOF

