                  return inflater.inflate(R.layout.fragment_home, container, false);
              }
          }
          EOF

          # QuranFragment.java
          cat > app/src/main/java/com/muslimguide/muslimpro/fragments/QuranFragment.java << 'EOF'
          package com.muslimguide.muslimpro.fragments;
          import android.os.Bundle;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.ViewGroup;
          import androidx.fragment.app.Fragment;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import com.android.volley.Request;
          import com.android.volley.toolbox.JsonArrayRequest;
          import com.muslimguide.muslimpro.R;
          import com.muslimguide.muslimpro.activities.App;
          import com.muslimguide.muslimpro.adapters.SuraAdapter;
          import com.muslimguide.muslimpro.models.Sura;
          import org.json.JSONException;
          import org.json.JSONObject;
          import java.util.ArrayList;
          import java.util.List;
          public class QuranFragment extends Fragment {
              private RecyclerView recyclerView;
              private List<Sura> suraList = new ArrayList<>();
              @Override
              public View onCreateView(LayoutInflater inflater, ViewGroup container, Bundle savedInstanceState) {
                  View view = inflater.inflate(R.layout.fragment_quran, container, false);
                  recyclerView = view.findViewById(R.id.rvSuraList);
                  recyclerView.setLayoutManager(new LinearLayoutManager(getContext()));
                  loadSuras();
                  return view;
              }
              private void loadSuras() {
                  String url = "https://api.alquran.cloud/v1/surah";
                  JsonArrayRequest request = new JsonArrayRequest(Request.Method.GET, url, null, response -> {
                      try {
                          for (int i = 0; i < response.length(); i++) {
                              JSONObject obj = response.getJSONObject(i);
                              suraList.add(new Sura(obj.getInt("number"), obj.getString("englishName"), obj.getString("name"), obj.getString("revelationType"), obj.getInt("numberOfAyahs")));
                          }
                          recyclerView.setAdapter(new SuraAdapter(suraList, getContext()));
                      } catch (JSONException e) { e.printStackTrace(); }
                  }, error -> {});
                  App.getInstance().getRequestQueue().add(request);
              }
          }
          EOF

          # PrayerTimeFragment.java
          cat > app/src/main/java/com/muslimguide/muslimpro/fragments/PrayerTimeFragment.java << 'EOF'
          package com.muslimguide.muslimpro.fragments;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.os.Bundle;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.TextView;
          import androidx.annotation.NonNull;
          import androidx.core.app.ActivityCompat;
          import androidx.fragment.app.Fragment;
          import com.google.android.gms.location.FusedLocationProviderClient;
          import com.google.android.gms.location.LocationServices;
          import com.muslimguide.muslimpro.R;
          import com.muslimguide.muslimpro.helpers.PrayerTimesHelper;
          import java.util.Map;
          public class PrayerTimeFragment extends Fragment {
              private FusedLocationProviderClient fusedLocationClient;
              private TextView tvFajr, tvDhuhr, tvAsr, tvMaghrib, tvIsha, tvSunrise;
              @Override
              public View onCreateView(LayoutInflater inflater, ViewGroup container, Bundle savedInstanceState) {
                  View view = inflater.inflate(R.layout.fragment_prayer_time, container, false);
                  tvFajr = view.findViewById(R.id.tvFajr);
                  tvDhuhr = view.findViewById(R.id.tvDhuhr);
                  tvAsr = view.findViewById(R.id.tvAsr);
                  tvMaghrib = view.findViewById(R.id.tvMaghrib);
                  tvIsha = view.findViewById(R.id.tvIsha);
                  tvSunrise = view.findViewById(R.id.tvSunrise);
                  fusedLocationClient = LocationServices.getFusedLocationProviderClient(requireActivity());
                  getPrayerTimes();
                  return view;
              }
              private void getPrayerTimes() {
                  if (ActivityCompat.checkSelfPermission(requireContext(), Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION}, 1);
                      return;
                  }
                  fusedLocationClient.getLastLocation().addOnSuccessListener(location -> {
                      if (location != null) updateUI(location);
                  });
              }
              private void updateUI(Location location) {
                  Map<String, String> times = PrayerTimesHelper.getPrayerTimes(location.getLatitude(), location.getLongitude());
                  tvFajr.setText("الفجر: " + times.get("Fajr"));
                  tvSunrise.setText("الشروق: " + times.get("Sunrise"));
                  tvDhuhr.setText("الظهر: " + times.get("Dhuhr"));
                  tvAsr.setText("العصر: " + times.get("Asr"));
                  tvMaghrib.setText("المغرب: " + times.get("Maghrib"));
                  tvIsha.setText("العشاء: " + times.get("Isha"));
              }
              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  if (requestCode == 1 && grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED)
                      getPrayerTimes();
              }
          }
          EOF

